services:
  - type: web
    name: roastledger-pos-sync
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PGLITE_DATA_DIR
        value: /tmp/roastledger-pg
